---
name: ci
on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  # No lock committed (see .gitignore) -- uv resolves telethon
                  # to latest on each run, so a cache keyed on it buys nothing.
                  enable-cache: false
                  python-version: "3.14"

            - name: Install dependencies
              run: uv sync

            - name: Run ruff (lint)
              run: uv run ruff check .

            - name: Run ruff (format)
              run: uv run ruff format --check .

            - name: Run ty (types)
              run: uv run ty check .
